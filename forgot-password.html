<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Reset Password | GearCashOut</title><link rel="stylesheet" href="style.css" /><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js" defer></script></head>
<body><header class="header"><div class="container header-container"><a class="logo" href="index.html">GEARCASHOUT</a><nav aria-label="Main navigation"><ul class="nav-list"><li><a href="index.html">Home</a></li><li><a href="quote.html">Get a Valuation</a></li><li><a href="how-it-works.html">How It Works</a></li><li><a href="faq.html">FAQ</a></li></ul></nav></div></header>
<main class="auth-page"><div class="auth-card"><p class="section-kicker">ACCOUNT ACCESS</p><h1>Reset your password</h1><p class="auth-intro">Enter your email address and we'll send you a secure password-reset link.</p><form id="reset-form" class="auth-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required /><button class="btn btn-primary" type="submit">SEND RESET LINK</button><p id="reset-message" class="form-message" role="status" aria-live="polite"></p></form><p class="auth-switch"><a href="login.html">Back to sign in</a></p></div></main><footer class="footer"><div class="container footer-container"><div><strong>GEARCASHOUT</strong><br />We buy drones, cameras, video and audio equipment.</div></div></footer>
<script>document.addEventListener("DOMContentLoaded",()=>{document.getElementById("reset-form").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("reset-message");m.textContent="Sending...";const email=document.getElementById("email").value.trim();const redirectTo=new URL("update-password.html",window.location.href).href;const {error}=await actionBuyerAuth.supabase.auth.resetPasswordForEmail(email,{redirectTo});if(error){m.textContent=error.message;m.className="form-message error";return;}m.textContent="If an account exists for that email, a reset link has been sent.";m.className="form-message success";});});</script></body></html>
