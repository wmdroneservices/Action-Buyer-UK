name: Rebrand to GearCashOut

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace old visible branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'Action Buyer UK': 'GearCashOut',
              'ACTION BUYER UK': 'GEARCASHOUT',
              'WE BUY ANY DRONE': 'GEARCASHOUT',
              'Action Buyer': 'GearCashOut',
              'ACTION BUYER': 'GEARCASHOUT',
          }

          extensions = {'.html', '.js', '.css', '.json', '.md', '.txt', '.xml', '.yml', '.yaml'}
          excluded_parts = {'.git', 'node_modules'}
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              if any(part in excluded_parts for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(item)
          PY

      - name: Commit rebrand changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No branding changes found."
            exit 0
          fi
          git commit -m "Rebrand site to GearCashOut"
          git push
