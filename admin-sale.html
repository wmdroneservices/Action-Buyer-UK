<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sale Details | GearCashOut</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
  <script src="admin-sale.js" defer></script>
</head>
<body>
<header class="header">
  <div class="container header-container">
    <a class="logo" href="index.html">GEARCASHOUT</a>
    <nav aria-label="Staff navigation">
      <ul class="nav-list">
        <li><a href="admin.html">Dashboard</a></li>
        <li><a href="admin-valuations.html">Valuations</a></li>
        <li><a href="admin-sales.html">Sales &amp; Shipping</a></li>

<main class="account-page">
  <div class="container">
    <div class="account-header">
      <div>
        <p class="section-kicker">SALE RECORD</p>
        <h1 id="sale-title">Sale details</h1>

<footer class="footer">
  <div class="container footer-container">
    <div><strong>GEARCASHOUT</strong><br>We buy drones, cameras, video and audio equipment.</div>
  </div>
