<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WE BUY ANY DRONE - Instant Quote Wizard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
    .wizard-step { display: none; }
    .wizard-step.active { display: block; }
    .buttons { margin-top: 20px; }
    button { padding: 10px 20px; margin-right: 10px; }
    select, input[type="radio"] { margin-top: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>

<h1>WE BUY ANY DRONE</h1>
<h2>Get An Instant Quote</h2>

<form id="quote-form" novalidate>

  <!-- Step 1 -->
  <section class="wizard-step active" data-step="1">
    <h3>Step 1: Select Manufacturer</h3>
    <label><input type="radio" name="manufacturer" value="dji" required> DJI</label>
    <div class="buttons">
      <button type="button" id="next">Next</button>
    </div>
  </section>

  <!-- Step 2 -->
  <section class="wizard-step" data-step="2">
    <h3>Step 2: Select DJI Model</h3>
    <select id="dji-model" name="djiModel" required>
      <option value="">Choose your model...</option>
    </select>
    <div class="buttons">
      <button type="button" id="back">Back</button>
      <button type="button" id="next">Next</button>
    </div>
  </section>

  <!-- Step 3 -->
  <section class="wizard-step" data-step="3">
    <h3>Step 3: Select Package</h3>
    <select id="package-select" name="package" required>
      <option value="">Choose your package...</option>
    </select>
    <div class="buttons">
      <button type="button" id="back">Back</button>
      <button type="button" id="next">Next</button>
    </div>
  </section>

</form>

<script src="quote.js" defer></script>
</body>
</html>
