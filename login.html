<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Sign In | GearCashOut</title><meta name="description" content="Sign in to your GearCashOut account." /><link rel="stylesheet" href="style.css" /><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js" defer></script></head>
<body><header class="header"><div class="container header-container"><a class="logo" href="index.html">GEARCASHOUT</a><nav aria-label="Main navigation"><ul class="nav-list"><li><a href="index.html">Home</a></li><li><a href="quote.html">Get a Valuation</a></li><li><a href="how-it-works.html">How It Works</a></li><li><a href="faq.html">FAQ</a></li><li><a href="contact.html">Contact</a></li></ul></nav></div></header>
<main class="auth-page"><div class="auth-card"><p class="section-kicker">YOUR ACCOUNT</p><h1>Sign in</h1><p class="auth-intro">Sign in to view your valuations and track your submissions.</p><form id="login-form" class="auth-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required /><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required /><button class="btn btn-primary" type="submit">SIGN IN</button><p id="login-message" class="form-message" role="status" aria-live="polite"></p></form><p class="auth-links"><a href="forgot-password.html">Forgotten your password?</a></p><p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p></div></main>
<footer class="footer"><div class="container footer-container"><div><strong>GEARCASHOUT</strong><br />We buy drones, cameras, video and audio equipment.</div></div></footer>
<script>document.addEventListener("DOMContentLoaded",async()=>{const existing=await actionBuyerAuth.getSession();if(existing){window.location.href="account.html";return;}const form=document.getElementById("login-form"),message=document.getElementById("login-message");form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="Signing in...";message.className="form-message";const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;const {error}=await actionBuyerAuth.supabase.auth.signInWithPassword({email,password});if(error){message.textContent=error.message;message.className="form-message error";return;}window.location.href="account.html";});});</script>
</body></html>
