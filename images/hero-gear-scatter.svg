<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Scattered drones, cameras and capture equipment">
<defs>
  <filter id="cutout" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="lum"/>
    <feComponentTransfer in="lum" result="mask"><feFuncA type="table" tableValues="1 1 .9 .35 0"/></feComponentTransfer>
    <feComposite in="SourceGraphic" in2="mask" operator="in"/>
  </filter>
</defs>
<g filter="url(#cutout)">
  <image href="category-drones.jpg" x="330" y="90" width="560" height="365" preserveAspectRatio="xMidYMid meet" transform="rotate(-6 610 272)"/>
  <image href="category-action-cameras.jpg" x="825" y="25" width="235" height="190" preserveAspectRatio="xMidYMid meet" transform="rotate(9 942 120)"/>
  <image href="category-cameras.jpg" x="825" y="210" width="285" height="225" preserveAspectRatio="xMidYMid meet" transform="rotate(-8 967 322)"/>
  <image href="category-lenses.jpg" x="690" y="445" width="255" height="225" preserveAspectRatio="xMidYMid meet" transform="rotate(12 817 557)"/>
  <image href="category-video-equipment.jpg" x="915" y="485" width="220" height="190" preserveAspectRatio="xMidYMid meet" transform="rotate(-10 1025 580)"/>
  <image href="category-audio.jpg" x="455" y="470" width="215" height="185" preserveAspectRatio="xMidYMid meet" transform="rotate(-13 562 562)"/>
  <image href="category-action-cameras.jpg" x="1040" y="340" width="155" height="140" preserveAspectRatio="xMidYMid meet" transform="rotate(15 1117 410)"/>
</g>
</svg>
