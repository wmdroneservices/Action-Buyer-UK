<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
<title id="title">GearCashOut</title>
<desc id="desc">GearCashOut compass adventure equipment buying logo</desc>
<defs>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a2a"/><stop offset="1" stop-color="#e84a10"/></linearGradient>
</defs>
<!-- Compact four-point adventure compass -->
<g transform="translate(92 92)">
  <circle r="82" fill="#0b0d0f"/>
  <circle r="70" fill="#f7f3ea" stroke="#0b0d0f" stroke-width="4"/>
  <path d="M0-62 L14-14 L62 0 L14 14 L0 62 L-14 14 L-62 0 L-14-14 Z" fill="#0b0d0f"/>
  <path d="M0-58 L11-11 L58 0 L11 11 L0 58 L-11 11 L-58 0 L-11-11 Z" fill="url(#orange)"/>
  <path d="M0-58 L11-11 L0 0 Z" fill="#f7f3ea"/>
  <path d="M0 58 L-11 11 L0 0 Z" fill="#c6ff3d"/>
  <circle r="7" fill="#0b0d0f"/>
  <text x="0" y="-88" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="900">N</text>
  <text x="88" y="6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="900">E</text>
  <text x="0" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="900">S</text>
  <text x="-88" y="6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="900">W</text>
</g>
<!-- Deliberately separated wordmark: no overlapping glyph boxes -->
<text x="190" y="92" textLength="195" lengthAdjust="spacingAndGlyphs" font-family="'Barlow Condensed','Arial Narrow',Impact,sans-serif" font-size="102" font-weight="800" fill="#0b0d0f">Gear</text>
<text x="392" y="92" textLength="205" lengthAdjust="spacingAndGlyphs" font-family="'Barlow Condensed','Arial Narrow',Impact,sans-serif" font-size="102" font-weight="800" fill="url(#orange)">Cash</text>
<text x="604" y="92" textLength="175" lengthAdjust="spacingAndGlyphs" font-family="'Barlow Condensed','Arial Narrow',Impact,sans-serif" font-size="102" font-weight="800" fill="#0b0d0f">Out</text>
<path d="M192 114 H780" stroke="#ff5a1f" stroke-width="6" stroke-linecap="round"/>
<text x="194" y="150" font-family="'DM Sans',Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="3.2" fill="#0b0d0f">WE BUY. YOU GET PAID.</text>
</svg>
