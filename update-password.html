<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose New Password | GearCashOut</title><link rel="stylesheet" href="style.css" /><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js" defer></script><script src="live-quote-nav.js?v=20260828-1" defer></script></head>
<body><header class="header"><div class="container header-container"><a class="logo" href="index.html">GEARCASHOUT</a></div></header><main class="auth-page"><div class="auth-card"><p class="section-kicker">ACCOUNT ACCESS</p><h1>Choose a new password</h1><form id="update-password-form" class="auth-form"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required /><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required /><button class="btn btn-primary" type="submit">UPDATE PASSWORD</button><p id="update-message" class="form-message" role="status" aria-live="polite"></p></form></div></main><script>document.addEventListener("DOMContentLoaded",()=>{document.getElementById("update-password-form").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("update-message"),p=document.getElementById("password").value,c=document.getElementById("confirm-password").value;if(p!==c){m.textContent="The passwords do not match.";m.className="form-message error";return;}const session=await actionBuyerAuth.getSession();if(!session){m.textContent="This reset link is invalid or has expired. Please request a new one.";m.className="form-message error";return;}const {error}=await actionBuyerAuth.supabase.auth.updateUser({password:p});if(error){m.textContent=error.message;m.className="form-message error";return;}m.textContent="Password updated. Redirecting to your account...";m.className="form-message success";setTimeout(()=>window.location.href="account.html",1000);});});</script></body></html>
